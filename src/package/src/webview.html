<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qsphere Visualizer</title>

    <link rel="stylesheet" href="webview.css">

    <script defer src="script/qsharpRuntime.bundle.js"></script>
    <script defer src="script/qsharpRuntimeUi.js"></script>
    <script defer src="script/math.js"></script>
    <script defer src="script/blochVector.js"></script>
    <script defer src="script/qsphereVector.js"></script>
    <script defer src="script/webview.bundle.js"></script>
</head>

<body>

    <h1 id="title">Qubit State Visualization</h1>
    <div id="view-tabs" role="tablist" aria-label="Visualization mode">
        <button class="view-tab active" type="button" role="tab" aria-selected="true" data-view-mode="bloch">
            Bloch
        </button>
        <button class="view-tab" type="button" role="tab" aria-selected="false" data-view-mode="qsphere">
            Q-sphere
        </button>
    </div>

    <div id="container">
        <canvas id="canvas"
                data-qsharp-wasm="wasm/qsc_wasm_bg.wasm"
                data-test-qs="test.qs"></canvas>

        <div id="bloch-labels">
            <div class="label" id="label-zero">|0⟩</div>
            <div class="label" id="label-one">|1⟩</div>
            <div class="label" id="label-plus">|+⟩</div>
            <div class="label" id="label-minus">|-⟩</div>
            <div class="label" id="label-i-plus">|+i⟩</div>
            <div class="label" id="label-i-minus">|-i⟩</div>
        </div>

        <div id="qs-labels"></div>
    </div>

    <div id="qsphere-phase-legend" aria-label="Q-sphere phase color legend">
        <canvas id="qsphere-phase-wheel" width="80" height="80"></canvas>
        <div class="phase-label phase-top">π/2</div>
        <div class="phase-label phase-right">0</div>
        <div class="phase-label phase-bottom">3π/2</div>
        <div class="phase-label phase-left">π</div>
        <div class="phase-center">Phase</div>
    </div>

    <div id="controls">
        <div id="qubit-column"></div>
    </div>

    <p id="status"></p>
</body>

</html>
