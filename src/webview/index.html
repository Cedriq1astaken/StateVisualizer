<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StateVisualizer</title>

    <link rel="stylesheet" href="dist/katex/katex.min.css">
    <link rel="stylesheet" href="styles.css">

    <script defer src="dist/qsharpRuntime.bundle.js"></script>
    <script defer src="runtime/qsharpRuntimeUi.js"></script>
    <script defer src="dist/qiskitRuntime.bundle.js"></script>
    <script defer src="dist/webview.bundle.js"></script>

</head>

<body>

    <h1 id="title">Qubit State Visualization</h1>
    <div id="view-tabs" role="tablist" aria-label="Visualization mode">
        <button class="view-tab active" type="button" role="tab" aria-selected="true" data-view-mode="statevector">
            Statevector
        </button>
        <button class="view-tab" type="button" role="tab" aria-selected="false" data-view-mode="bloch">
            Bloch
        </button>
        <button class="view-tab" type="button" role="tab" aria-selected="false" data-view-mode="qsphere">
            Q-sphere
        </button>
        <button class="view-tab" type="button" role="tab" aria-selected="false" data-view-mode="densitymatrix">
            Density Matrix
        </button>
    </div>

    <div id="statevector-container">
        <div id="statevector-chart-wrapper">
            <canvas id="statevector-canvas"></canvas>
        </div>
        <div id="statevector-bottom-bar" class="statevector-bottom-bar">
            <div id="statevector-phase-legend" class="phase-horizontal-legend" aria-label="Statevector phase color legend">
                <div class="phase-label phase-title">Phase</div>
                <div class="phase-horizontal-body">
                    <canvas class="phase-horizontal-bar-canvas" width="220" height="10"></canvas>
                    <div class="phase-horizontal-ticks">
                        <span class="phase-label">0</span>
                        <span class="phase-label">π/2</span>
                        <span class="phase-label">π</span>
                        <span class="phase-label">3π/2</span>
                        <span class="phase-label">2π</span>
                    </div>
                </div>
            </div>
            <div class="statevector-mode-toggle" role="group" aria-label="Statevector amplitude/probability mode">
                <button type="button" class="statevector-toggle-btn active" data-statevector-mode="amplitude">Amplitude</button>
                <button type="button" class="statevector-toggle-btn" data-statevector-mode="probability">Probability</button>
            </div>
        </div>
    </div>

    <div id="densitymatrix-container" class="densitymatrix-container" aria-label="Density matrix visualization">
        <div id="densitymatrix-stats" class="densitymatrix-stats"></div>
        <div id="densitymatrix-panels-2d" class="densitymatrix-panels">
            <div class="densitymatrix-panel">
                <canvas id="densitymatrix-real-canvas" class="densitymatrix-canvas"></canvas>
            </div>
            <div class="densitymatrix-panel">
                <canvas id="densitymatrix-imag-canvas" class="densitymatrix-canvas"></canvas>
            </div>
        </div>
        <div id="densitymatrix-panels-3d" class="densitymatrix-panels" style="display: none;">
            <div class="densitymatrix-3d-panel">
                <div class="densitymatrix-3d-title">Real Part (Re[ρ])</div>
                <div class="densitymatrix-3d-stage">
                    <canvas id="densitymatrix-real-3d-canvas" class="densitymatrix-3d-canvas"></canvas>
                    <div id="densitymatrix-real-3d-labels" class="densitymatrix-3d-labels"></div>
                </div>
            </div>
            <div class="densitymatrix-3d-panel">
                <div class="densitymatrix-3d-title">Imaginary Part (Im[ρ])</div>
                <div class="densitymatrix-3d-stage">
                    <canvas id="densitymatrix-imag-3d-canvas" class="densitymatrix-3d-canvas"></canvas>
                    <div id="densitymatrix-imag-3d-labels" class="densitymatrix-3d-labels"></div>
                </div>
            </div>
        </div>
        <div id="densitymatrix-bottom-bar" class="densitymatrix-bottom-bar">
            <div id="densitymatrix-legend" class="densitymatrix-legend" aria-label="Density matrix color legend">
                <div class="phase-label phase-title">Matrix Element Value</div>
                <div class="phase-horizontal-body">
                    <canvas id="densitymatrix-legend-canvas" class="densitymatrix-legend-canvas" width="240" height="10"></canvas>
                    <div class="densitymatrix-legend-ticks">
                        <span class="phase-label">-1.0</span>
                        <span class="phase-label">-0.5</span>
                        <span class="phase-label">0.0</span>
                        <span class="phase-label">+0.5</span>
                        <span class="phase-label">+1.0</span>
                    </div>
                </div>
            </div>
            <div class="density-mode-toggle" role="group" aria-label="Density matrix 2D/3D mode">
                <button type="button" class="density-toggle-btn active" data-density-mode="2d">2D</button>
                <button type="button" class="density-toggle-btn" data-density-mode="3d">3D</button>
            </div>
        </div>
    </div>

    <div id="qsphere-view-wrapper">
        <div id="container">
            <canvas id="canvas" data-qsharp-wasm="assets/wasm/qsc_wasm_bg.wasm" data-test-qs="samples/test.qs"></canvas>

            <div id="qs-labels"></div>
        </div>


        <div id="qsphere-phase-legend" class="phase-column-legend" aria-label="Q-sphere phase color legend">
            <div class="phase-label phase-title">Phase</div>
            <div class="phase-column-body">
                <canvas class="phase-bar-canvas" width="10" height="180"></canvas>
                <div class="phase-ticks">
                    <span class="phase-label">2π</span>
                    <span class="phase-label">3π/2</span>
                    <span class="phase-label">π</span>
                    <span class="phase-label">π/2</span>
                    <span class="phase-label">0</span>
                </div>
            </div>
        </div>
    </div>

    <div id="controls">
        <div id="qubit-column"></div>
    </div>

    <div id="footer-container">
        <div id="latex-container" class="latex-container" aria-label="Quantum state mathematical formula">
            <div class="latex-content-wrapper">
                <span class="latex-formula-label">State:</span>
                <div id="latex-formula" class="latex-formula">|\psi\rangle = |0\rangle</div>
            </div>
            <button id="copy-latex-btn" class="action-btn copy-latex-btn" type="button" title="Copy state as LaTeX" aria-label="Copy LaTeX">
                <svg class="action-icon copy-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M5.5 3.5H11.5C12.0523 3.5 12.5 3.94772 12.5 4.5V12.5C12.5 13.0523 12.0523 13.5 11.5 13.5H5.5C4.94772 13.5 4.5 13.0523 4.5 12.5V4.5C4.5 3.94772 4.94772 3.5 5.5 3.5Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M3.5 10.5H2.5C1.94772 10.5 1.5 10.0523 1.5 9.5V2.5C1.5 1.94772 1.94772 1.5 2.5 1.5H9.5C10.0523 1.5 10.5 1.94772 10.5 2.5V3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <div id="footer-actions">
        <button id="live-btn" class="action-btn live-btn active" type="button" title="Live updates active (click to pause)" aria-pressed="true">
            <span class="live-dot"></span>
            <span>Live</span>
        </button>
        <button id="export-btn" class="action-btn" type="button" title="Export visualization as PNG and SVG">
            <svg class="action-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 2V10M8 10L5 7M8 10L11 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 11V13C2 13.5523 2.44772 14 3 14H13C13.5523 14 14 13.5523 14 13V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>Export</span>
        </button>
    </div>
</body>

</html>
