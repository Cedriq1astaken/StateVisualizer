<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StateVisualizer</title>

    <link rel="stylesheet" href="styles.css">

    <script defer src="dist/qsharpRuntime.bundle.js"></script>
    <script defer src="runtime/qsharpRuntimeUi.js"></script>
    <script defer src="dist/webview.bundle.js"></script>

</head>

<body>

    <h1 id="title">Qubit State Visualization</h1>
    <div id="view-tabs" role="tablist" aria-label="Visualization mode">
        <button class="view-tab active" type="button" role="tab" aria-selected="true" data-view-mode="statevector">
            Statevector
        </button>
        <button class="view-tab" type="button" role="tab" aria-selected="false" data-view-mode="bloch">
            Bloch
        </button>
        <button class="view-tab" type="button" role="tab" aria-selected="false" data-view-mode="qsphere">
            Q-sphere
        </button>
    </div>

    <div id="statevector-container">
        <div id="statevector-chart-wrapper">
            <canvas id="statevector-canvas"></canvas>
        </div>
        <div id="statevector-phase-legend" class="phase-horizontal-legend" aria-label="Statevector phase color legend">
            <div class="phase-label phase-title">Phase</div>
            <div class="phase-horizontal-body">
                <canvas class="phase-horizontal-bar-canvas" width="220" height="10"></canvas>
                <div class="phase-horizontal-ticks">
                    <span class="phase-label">0</span>
                    <span class="phase-label">π/2</span>
                    <span class="phase-label">π</span>
                    <span class="phase-label">3π/2</span>
                    <span class="phase-label">2π</span>
                </div>
            </div>
        </div>
    </div>

    <div id="qsphere-view-wrapper">
        <div id="container">
            <canvas id="canvas" data-qsharp-wasm="assets/wasm/qsc_wasm_bg.wasm" data-test-qs="samples/test.qs"></canvas>

            <div id="qs-labels"></div>
        </div>


        <div id="qsphere-phase-legend" class="phase-column-legend" aria-label="Q-sphere phase color legend">
            <div class="phase-label phase-title">Phase</div>
            <div class="phase-column-body">
                <canvas class="phase-bar-canvas" width="10" height="180"></canvas>
                <div class="phase-ticks">
                    <span class="phase-label">2π</span>
                    <span class="phase-label">3π/2</span>
                    <span class="phase-label">π</span>
                    <span class="phase-label">π/2</span>
                    <span class="phase-label">0</span>
                </div>
            </div>
        </div>
    </div>

    <div id="controls">
        <div id="qubit-column"></div>
    </div>

    <div id="footer-actions">
        <button id="export-btn" class="action-btn" type="button" title="Export visualization as PNG and SVG">
            <svg class="action-icon" width="13" height="13" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 2V10M8 10L5 7M8 10L11 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M2 11V13C2 13.5523 2.44772 14 3 14H13C13.5523 14 14 13.5523 14 13V11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>Export</span>
        </button>
    </div>
</body>

</html>
